name: publish-public-images

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-images]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsyu-server (private, deploy key)
        uses: actions/checkout@v4
        with:
          repository: cheezone/dsyu-server
          ssh-key: ${{ secrets.DSYU_SERVER_DEPLOY_KEY }}
          path: src

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/deploy/dokploy/Dockerfile.control
          push: true
          tags: |
            ghcr.io/cheezone/dsyu-images/control:latest
            ghcr.io/${{ github.repository }}/control:latest

      - name: Build and push relay
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/deploy/dokploy/Dockerfile.relay
          push: true
          tags: |
            ghcr.io/cheezone/dsyu-images/relay:latest
            ghcr.io/${{ github.repository }}/relay:latest

      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in \
            'dsyu-images/control' \
            'dsyu-images/relay' \
            'control' \
            'relay'
          do
            enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$name")
            echo "Trying package visibility for: $name"
            code=$(curl -sS -o /tmp/pkg-vis.json -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${enc}/visibility" \
              -d '{"visibility":"public"}' || true)
            echo "HTTP $code for $name"
            cat /tmp/pkg-vis.json || true
            echo
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then
              echo "OK: $name is public"
            fi
          done