name: publish-public-images

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-images]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dsyu-server (private, deploy key)
        uses: actions/checkout@v4
        with:
          repository: cheezone/dsyu-server
          ssh-key: ${{ secrets.DSYU_SERVER_DEPLOY_KEY }}
          path: src

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/deploy/dokploy/Dockerfile.control
          push: true
          tags: |
            ghcr.io/cheezone/dsyu-images/control:latest
            ttl.sh/dsyu-no8-control:28d

      - name: Build and push relay
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/deploy/dokploy/Dockerfile.relay
          push: true
          tags: |
            ghcr.io/cheezone/dsyu-images/relay:latest
            ttl.sh/dsyu-no8-relay:28d